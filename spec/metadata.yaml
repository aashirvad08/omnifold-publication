format_version: '0.1'
dataset:
  name: OmniFold pseudodata example
  experiment: ATLAS-like simulation
  description: Example OmniFold event-level observables and reweighting outputs for pseudodata studies.
  schema_version: '1.0'
  provenance_note: 'The local data/*.h5 files are a reduced release version, not the exact files behind
    the saved outputs of the public sm-z-jets-omnifold-2024 notebooks: same event counts (418014 nominal),
    but 200 columns vs 276 (150 stored replica weights vs ~226) and different weight content (nEff of
    weights_nominal 213024 vs 197876 printed; sum 1809.46 fb vs 1808.34 fb printed). Inclusive NP variations
    agree with the saved notebook outputs to <= 0.02 percentage points; tail regions (pT_ll > 500 GeV)
    to <= 0.26. See docs/data_provenance.md (verified 2026-07-19).'
generation:
  nominal_generator: MG5 (nominal sample, analysis-specific setup not documented in file)
  alternative_generators:
  - Sherpa
  alternative_samples:
  - nonDY
files:
  nominal:
    filename: multifold.h5
    path: data/multifold.h5
    event_count: 418014
  systematics:
  - filename: multifold_sherpa.h5
    path: data/multifold_sherpa.h5
    event_count: 326430
    note: Alternative-generator variation with reduced weight families.
  - filename: multifold_nonDY.h5
    path: data/multifold_nonDY.h5
    event_count: 433397
    note: Alternative sample with nominal-only weighting.
